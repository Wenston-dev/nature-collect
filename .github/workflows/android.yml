name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Reuse one signing key across runs so new APKs update the installed app.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ci-signing/release.keystore
          # v3 saves a copy in main's own cache scope; the first run restores v2
          # from the old default branch so the key itself never changes.
          key: signing-key-v3
          restore-keys: signing-key-v2

      - name: Create signing key if missing
        run: |
          mkdir -p ci-signing
          if [ ! -f ci-signing/release.keystore ]; then
            keytool -genkeypair -keystore ci-signing/release.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        env:
          SIGNING_KEYSTORE: ${{ github.workspace }}/ci-signing/release.keystore
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nature-collect-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
