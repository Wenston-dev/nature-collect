name: Android build

on:
  push:
    branches: [main, "claude/**"]
    # Pushing a tag like v0.10.1 also publishes the APK on the Releases page.
    tags: ["v*"]
  pull_request:
  # Running it by hand with "release" ticked publishes the current versionName
  # as tag v<versionName>, for when pushing a tag isn't an option.
  workflow_dispatch:
    inputs:
      release:
        description: Publish to Releases as v<versionName>
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Set this repository secret to pin the signing key for good (see README).
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches versionName
        if: env.IS_RELEASE == 'true'
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          elif [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          else
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use signing key from secret
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ci-signing
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > ci-signing/release.keystore

      # Without the secret, reuse one cached key across runs so new APKs update
      # the installed app. The cache is dropped after 7 days without a build.
      - name: Restore signing key
        if: env.SIGNING_KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ci-signing/release.keystore
          # v3 saves a copy in main's own cache scope; the first run restores v2
          # from the old default branch so the key itself never changes.
          key: signing-key-v3
          restore-keys: signing-key-v2

      - name: Create signing key if missing
        run: |
          mkdir -p ci-signing
          if [ ! -f ci-signing/release.keystore ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::No signing key: a release signed with a new key could not update installed apps. Add the SIGNING_KEYSTORE_BASE64 secret."
              exit 1
            fi
            keytool -genkeypair -keystore ci-signing/release.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        env:
          SIGNING_KEYSTORE: ${{ github.workspace }}/ci-signing/release.keystore
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nature-collect-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish to Releases
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="shiye-$RELEASE_TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # A release made on the web page already exists; just attach the APK.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" --clobber
          else
            gh release create "$RELEASE_TAG" "$apk" --target "$GITHUB_SHA" --title "拾野 $RELEASE_TAG" --generate-notes
          fi
