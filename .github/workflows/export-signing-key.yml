name: Export signing key

# Temporary, removed before this branch merges: packs the cached signing key as
# base64 text so the owner can save it as the SIGNING_KEYSTORE_BASE64 secret.
# Runs only while the repository is private; the artifact expires after 1 day.

on:
  push:
    branches: [claude/project-thread-iggzox]
    paths: [.github/workflows/export-signing-key.yml]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Restore signing key
        uses: actions/cache/restore@v4
        with:
          path: ci-signing/release.keystore
          key: signing-key-v3
          restore-keys: signing-key-v2

      - name: Encode
        run: |
          if [ ! -f ci-signing/release.keystore ]; then
            echo "::error::The cached signing key is gone."
            exit 1
          fi
          base64 -w0 ci-signing/release.keystore > SIGNING_KEYSTORE_BASE64.txt
          keytool -list -v -keystore ci-signing/release.keystore -storepass android | grep SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: SIGNING_KEYSTORE_BASE64.txt
          retention-days: 1
